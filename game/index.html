<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="《还有一格电》离线视觉小说。">
  <title>还有一格电｜视觉小说</title>
  <link rel="stylesheet" href="style.css">
  <script src="story-data.js" defer></script>
  <script src="player.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到游戏内容</a>
  <main id="main" class="app-shell">
    <section id="title-screen" class="title-screen" aria-labelledby="game-title">
      <div class="title-art" aria-hidden="true">
        <div class="title-road"></div>
        <div class="title-light"></div>
        <span class="title-battery">1</span>
      </div>
      <div class="title-copy">
        <p class="eyebrow">2018—2019 · 北京 · 离线视觉小说</p>
        <h1 id="game-title">还有一格电</h1>
        <p class="title-description">一辆车、一份工作、几笔要按时记清的钱。</p>
        <p id="startup-message" class="startup-message" role="status">正在载入剧情数据…</p>
        <div class="title-actions" aria-label="主菜单">
          <button id="start-button" class="button button-primary" type="button" disabled>开始游戏</button>
          <button id="continue-button" class="button" type="button" hidden>继续</button>
          <button id="chapters-button" class="button" type="button" disabled>章节选择</button>
          <button id="settings-button" class="button" type="button">设置</button>
        </div>
<small data-site-count="one-bar-left" style="display:block;text-align:center;color:#888;font:12px/1.5 system-ui,sans-serif;padding:6px 12px;">网站累计访问人数：—</small>
        <p class="keyboard-hint">操作：Enter / 空格继续 · Esc菜单 · H历史 · 方向键选择</p>
      </div>
    </section>

    <section id="play-screen" class="play-screen" hidden aria-label="游戏正文">
      <header class="game-topbar">
        <button id="menu-button" class="icon-button" type="button" aria-label="打开菜单">菜单</button>
        <div class="progress-info">
          <span id="chapter-label">第1章</span>
          <span id="scene-label">场景 1 / 1</span>
          <progress id="story-progress" value="0" max="100" aria-label="阅读进度"></progress>
        </div>
        <button id="history-button" class="icon-button" type="button" aria-label="打开历史记录">历史</button>
      </header>

      <section id="scene-stage" class="scene-stage" data-background="station" aria-label="当前场景">
        <div class="stage-wash" aria-hidden="true"></div>
        <img id="background-image" class="background-image" alt="" aria-hidden="true">
        <div class="scene-location" id="scene-location"></div>
        <div class="portrait-frame" id="portrait-frame" hidden>
          <img id="portrait-image" class="portrait-image" alt="" aria-hidden="true">
          <span id="portrait-fallback" class="portrait-fallback" aria-hidden="true"></span>
        </div>
      </section>

      <article class="narrative-panel">
        <div class="scene-heading">
          <p id="scene-chapter" class="eyebrow"></p>
          <h1 id="scene-title"></h1>
        </div>
        <div id="text-content" class="text-content" aria-hidden="true"></div>
        <p id="screen-reader-text" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></p>
        <section id="choice-panel" class="choice-panel" aria-label="选择" hidden>
          <p id="choice-prompt" class="choice-prompt"></p>
          <div id="choice-options" class="choice-options"></div>
        </section>
        <p id="game-status" class="status-message" role="status" aria-live="polite"></p>
        <div class="advance-row">
          <span id="speaker-label" class="speaker-label">旁白</span>
          <button id="advance-button" class="button button-primary" type="button" disabled>继续</button>
        </div>
      </article>

      <nav class="game-toolbar" aria-label="阅读控制">
        <button id="auto-button" class="toolbar-button" type="button" aria-pressed="false">自动：关</button>
        <button id="skip-button" class="toolbar-button" type="button" aria-pressed="false">已读快进：关</button>
        <button id="save-button" class="toolbar-button" type="button">存读档</button>
        <button id="settings-game-button" class="toolbar-button" type="button">设置</button>
      </nav>
    </section>
  </main>

  <dialog id="modal" class="modal" aria-labelledby="modal-title">
    <div class="modal-header">
      <h2 id="modal-title"></h2>
      <button id="modal-close" class="icon-button" type="button" aria-label="关闭">关闭</button>
    </div>
    <div id="modal-content" class="modal-content"></div>
  </dialog>
  <input id="import-file" type="file" accept="application/json,.json" hidden>

<script>
/* 自建累计访客脚注：独立站点身份，不读取游戏存档或发送页面内容。 */
(() => {
  'use strict';
  // 与自建服务的公开站点登记一致；本地与预览页不创建或发送身份。
const GH='https://gongfpp.github.io', DAY=86400000;
const gh=path=>[{origin:GH,path,prefix:true}];
const SITE_REGISTRY=Object.freeze({
 'cyber-handwarmer':[{origin:'https://warm.gongfpp.icu',path:'/',prefix:false}],
 itsme:[{origin:'https://gongfpp.icu',path:'/',prefix:false},{origin:GH,path:'/',prefix:false}],
 novelfish:gh('/NovelFish/'),
 'monkey-shakespeare':gh('/monkey-shakespeare-web/'),
 'hr-monster':gh('/hr-monster-web/'),
 'rps-mind-arena':gh('/rps-mind-arena-web/'),
 'monster-service-center':gh('/monster-service-center-web/'),
 'flappy-bird':gh('/flappy-bird-godot/'),
 cinderweave:gh('/cinderweave-godot/'),
 'hyouka-campus':gh('/hyouka-campus-3d/'),
 'leek-spire':[...gh('/leek-spire-pages/'),{origin:'https://leek-spire.gongfpp.chatgpt.site',path:'/',prefix:false},{origin:'https://leek-spire.gongfpp.chatgpt.site',path:'/fx.html',prefix:false}],
 'one-bar-left':gh('/one-bar-left/'),
 'kurumi-rewrite':gh('/kurumi-fx-rewrite/'),
 'poor-map':gh('/poor-map/'),
 'stock-workbench':[{origin:'https://stock.gongfpp.icu',path:'/',prefix:true}],
 'one-life':[{origin:'https://one-life.gongfpp.icu',path:'/',prefix:true}],
});
for(const entries of Object.values(SITE_REGISTRY)){for(const entry of entries)Object.freeze(entry);Object.freeze(entries);}
function registeredPath(site,origin,path){
 if(typeof path!=='string'||path.length>512||!path.startsWith('/')||/[?#\\\u0000-\u0020]/.test(path)||/%(?:2e|2f|5c|00)/i.test(path)||path.split('/').some(x=>x==='.'||x==='..'))return false;
 return Object.hasOwn(SITE_REGISTRY,site)&&SITE_REGISTRY[site].some(r=>r.origin===origin&&(r.prefix?path.startsWith(r.path):path===r.path));
}

  const lifetime = 90 * 24 * 60 * 60 * 1000;
  const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
  async function mount(element, site, isDisabled = () => false) {
    element.textContent = '网站累计访问人数：—';
    if (!registeredPath(site, location.origin, location.pathname)) return;
    const url = 'https://stats.gongfpp.icu/api/journey/v1/site-counts/' + encodeURIComponent(site);
    let identity = null;
    try {
      if (navigator.doNotTrack !== '1' && window.doNotTrack !== '1' && navigator.globalPrivacyControl !== true && !isDisabled()) {
        const key = 'site-visitor-count:v1:' + site;
        const now = Date.now();
        try { identity = JSON.parse(localStorage.getItem(key)); } catch (_) { /* 损坏的记录可以更新；存储禁用时保持只读。 */ }
        if (!identity || !uuid.test(identity.visitorId) || !Number.isSafeInteger(identity.bornAt) || identity.bornAt > now || now - identity.bornAt >= lifetime) {
          identity = { visitorId: crypto.randomUUID(), bornAt: now };
          localStorage.setItem(key, JSON.stringify(identity));
        }
      }
    } catch (_) { identity = null; }
    let controller = new AbortController();
    let timeout = setTimeout(() => controller.abort(), 8000);
    const options = { credentials: 'omit', referrerPolicy: 'no-referrer', cache: 'no-store', signal: controller.signal };
    try {
      let response;
      if (identity) {
        try {
          response = await fetch(url, { ...options, method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ visitorId: identity.visitorId, bornAt: identity.bornAt, path: location.pathname }) });
        } catch (_) { /* 写入失败后仍可读取真实累计值。 */ }
      }
      if (!response || !response.ok) {
        clearTimeout(timeout);
        controller = new AbortController();
        timeout = setTimeout(() => controller.abort(), 8000);
        response = await fetch(url, { ...options, signal: controller.signal });
      }
      if (!response.ok) return;
      const result = await response.json();
      if (result.version === 1 && result.site === site && Number.isSafeInteger(result.total) && result.total >= 0) {
        element.textContent = '网站累计访问人数：' + result.total.toLocaleString('zh-CN');
      }
    } catch (_) { /* 无可靠结果时保留破折号，不伪造零。 */ }
    finally { clearTimeout(timeout); }
  }
  window.SiteVisitorCount = { mount };
  document.querySelectorAll('[data-site-count]').forEach(element => {
    mount(element, element.dataset.siteCount, () => typeof window.siteVisitorCountDisabled === 'function' && window.siteVisitorCountDisabled());
  });
})();

</script>
